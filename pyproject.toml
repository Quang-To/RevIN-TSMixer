[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revin-tsmixer"
version = "0.1.0"
description = "Decision-aware probabilistic demand forecasting under distribution shift"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "optuna",
    "pandas",
    "scikit-learn",
    "scipy",
    "seaborn",
    "statsmodels",
    "torch>=2.0",
]

[project.scripts]
revin-train = "main:main"
revin-simulate = "src.data.simulate:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools]
py-modules = ["config", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["*.ipynb", "checkpoints_optuna", "results"]
